<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SpendLessBro 💸 — Summary</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="app-shell" id="appShell">

  <nav class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <span class="logo-icon">💸</span>
      <span class="logo-text">SpendLessBro</span>
    </div>
    <ul class="nav-links">
      <li><a href="index.html" class="nav-link"><span class="nav-icon">🏠</span> Dashboard</a></li>
      <li><a href="expenses.html" class="nav-link"><span class="nav-icon">➕</span> Add Expense</a></li>
      <li><a href="summary.html" class="nav-link active"><span class="nav-icon">📊</span> Summary</a></li>
    </ul>
    <div class="sidebar-bottom">
      <button class="btn-sidebar-action" onclick="resetMonth()">🔄 Monthly Reset</button>
      <button class="btn-sidebar-action export" onclick="exportCSV()">⬇️ Export CSV</button>
    </div>
  </nav>

  <header class="topbar">
    <button class="hamburger" onclick="toggleSidebar()"><span></span><span></span><span></span></button>
    <span class="topbar-title">💸 SpendLessBro</span>
  </header>
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

  <main class="main-content">
    <div class="page-header">
      <div>
        <h1 class="page-title">Summary 📊</h1>
        <p class="page-subtitle" id="summaryMonth">Monthly Overview</p>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card income-card">
        <div class="stat-emoji">💰</div>
        <div class="stat-label">Income</div>
        <div class="stat-value" id="sumIncome">R 0.00</div>
      </div>
      <div class="stat-card expense-card">
        <div class="stat-emoji">💸</div>
        <div class="stat-label">Expenses</div>
        <div class="stat-value" id="sumExpenses">R 0.00</div>
      </div>
      <div class="stat-card balance-card">
        <div class="stat-emoji">🏦</div>
        <div class="stat-label">Balance</div>
        <div class="stat-value" id="sumBalance">R 0.00</div>
      </div>
      <div class="stat-card savings-card">
        <div class="stat-emoji">📈</div>
        <div class="stat-label">Saved</div>
        <div class="stat-value" id="sumSavings">0%</div>
      </div>
    </div>

    <div class="card">
      <h3 class="card-title">Spending by Category (Bar Chart) 📊</h3>
      <div style="height:250px">
        <canvas id="barChart"></canvas>
      </div>
    </div>

    <div class="card">
      <h3 class="card-title">Category Breakdown 📋</h3>
      <div id="breakdownTable"><p class="empty-msg">No expenses this month yet.</p></div>
    </div>

    <div class="card tips-card">
      <h3 class="card-title">💡 Money Tips for Students</h3>
      <div class="tips-grid" id="tipsGrid"></div>
    </div>
  </main>
</div>

<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script src="js/summary.js"></script>
</body>
</html>
